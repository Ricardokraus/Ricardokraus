<svg xmlns="http://www.w3.org/2000/svg" width="380" height="124" viewBox="0 0 380 124" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .lk { animation: lk 3.6s infinite; }
    .rk { animation: rk 3.6s infinite; }
    .led { animation: led 3.6s infinite; }
    .ring { animation: ring 3.6s infinite; transform-box: fill-box; transform-origin: center; }
    .flow { animation: flow 0.9s linear infinite; }
    @keyframes lk {
      0%, 8% { transform: translateY(0); animation-timing-function: ease-in; }
      12%, 20% { transform: translateY(3px); animation-timing-function: ease-out; }
      26%, 100% { transform: translateY(0); }
    }
    @keyframes rk {
      0%, 34% { transform: translateY(0); animation-timing-function: ease-in; }
      38%, 48% { transform: translateY(3px); animation-timing-function: ease-out; }
      54%, 100% { transform: translateY(0); }
    }
    @keyframes led {
      0%, 36% { fill: #3A3A3A; }
      40%, 86% { fill: #30D158; }
      100% { fill: #3A3A3A; }
    }
    @keyframes ring {
      0%, 36% { opacity: 0; transform: scale(0.6); }
      39% { opacity: 0.6; transform: scale(0.8); }
      58%, 100% { opacity: 0; transform: scale(3.4); }
    }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @media (prefers-reduced-motion: reduce) {
      .lk, .rk, .led, .ring, .flow { animation: none; }
      .ring { opacity: 0; }
      .led { fill: #30D158; }
    }
  </style>
  <rect x="0.5" y="0.5" width="379" height="123" rx="14" fill="#202020" stroke="#E9E4D6" stroke-opacity="0.12"/>

  <!-- left key: NitroSense -->
  <rect x="26" y="33" width="122" height="44" rx="10" fill="#121212"/>
  <g class="lk">
    <rect x="26.5" y="30.5" width="121" height="43" rx="9.5" fill="#3D3D3D" stroke="#505050"/>
    <text x="87" y="52.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#F3F3F3">NitroSense</text>
  </g>

  <!-- arrow -->
  <path class="flow" d="M160 52 H194" stroke="#ABABAB" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
  <path d="M192 44 L201 52 L192 60" stroke="#ABABAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right key: Num Lock -->
  <rect x="222" y="33" width="122" height="44" rx="10" fill="#121212"/>
  <g class="rk">
    <rect x="222.5" y="30.5" width="121" height="43" rx="9.5" fill="#3D3D3D" stroke="#505050"/>
    <text x="283" y="52.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#F3F3F3">Num Lock</text>
  </g>

  <!-- LED -->
  <circle class="ring" cx="283" cy="16" r="4" stroke="#30D158" stroke-width="1.5" opacity="0"/>
  <circle class="led" cx="283" cy="16" r="4" fill="#3A3A3A"/>

  <!-- key codes, like the app -->
  <text class="mono" x="87" y="101" text-anchor="middle" font-size="11" fill="#ABABAB">VK FF · SC 175</text>
  <text class="mono" x="283" y="101" text-anchor="middle" font-size="11" fill="#ABABAB">VK 90 · SC 145</text>
</svg>
