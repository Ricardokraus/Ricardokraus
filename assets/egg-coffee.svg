<svg xmlns="http://www.w3.org/2000/svg" width="380" height="124" viewBox="0 0 380 124" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .steam { animation: steam 2.4s ease-out infinite; opacity: 0; }
    .s2 { animation-delay: 0.8s; }
    .s3 { animation-delay: 1.6s; }
    .cup { animation: cup 2.4s ease-in-out infinite; }
    .fill { animation: fill 4s infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(6px); }
      25% { opacity: 0.75; }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes cup {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes fill {
      0% { transform: scaleX(0.04); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
      55%, 88% { transform: scaleX(1); }
      100% { transform: scaleX(0.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam, .cup, .fill { animation: none; }
      .steam { opacity: 0.5; }
      .fill { transform: scaleX(1); }
    }
  </style>
  <rect x="0.5" y="0.5" width="379" height="123" rx="14" fill="#202020" stroke="#E9E4D6" stroke-opacity="0.12"/>

  <!-- cup -->
  <g class="cup" transform="translate(40 34)">
    <g stroke="#E9E4D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path class="steam" d="M18 8 c-6 -5 6 -9 0 -15" />
      <path class="steam s2" d="M32 8 c-6 -5 6 -9 0 -15" />
      <path class="steam s3" d="M46 8 c-6 -5 6 -9 0 -15" />
      <path d="M2 16 H62 V42 a22 22 0 0 1 -22 22 H24 a22 22 0 0 1 -22 -22 Z" fill="#E9E4D6" fill-opacity="0.08"/>
      <path d="M62 24 h6 a9 9 0 0 1 0 18 h-6" />
      <path d="M-6 72 H70" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- terminal-ish readout -->
  <text class="mono" x="150" y="46" font-size="14" fill="#E9E4D6" fill-opacity="0.9">$ cafe --refill</text>
  <rect x="150" y="58" width="190" height="8" rx="4" fill="#2B2B2B"/>
  <rect class="fill" x="150" y="58" width="190" height="8" rx="4" fill="#30D158"/>
  <text x="150" y="90" font-size="11" fill="#ABABAB">cafeína</text>
  <text x="340" y="90" text-anchor="end" font-size="11" fill="#ABABAB">100%</text>
</svg>
