<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .fade   { animation: fade 1.2s ease-out both; }
    .fade2  { animation: fade 1.2s ease-out .3s both; }
    .fade3  { animation: fade 1.2s ease-out .6s both; }
    .scan   { animation: scan 6s linear infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    @keyframes fade  { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes scan  { from { transform: translateX(-1000px) } to { transform: translateX(1000px) } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#E9E4D6" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E4D6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9E4D6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E9E4D6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="14" fill="#1A1A1A"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="13.5" stroke="#E9E4D6" stroke-opacity="0.12"/>

  <!-- window dots -->
  <circle cx="34" cy="32" r="5" fill="#E9E4D6" fill-opacity="0.25"/>
  <circle cx="54" cy="32" r="5" fill="#E9E4D6" fill-opacity="0.25"/>
  <circle cx="74" cy="32" r="5" fill="#E9E4D6" fill-opacity="0.25"/>
  <text x="966" y="36" text-anchor="end" class="mono" font-size="13" fill="#E9E4D6" fill-opacity="0.45">~/ricardokraus</text>

  <!-- content -->
  <text x="60" y="110" class="mono fade" font-size="16" fill="#E9E4D6" fill-opacity="0.5">$ whoami</text>
  <text x="60" y="165" class="sans fade2" font-size="58" font-weight="700" fill="#E9E4D6" letter-spacing="-1">Ricardo Kraus</text>
  <rect x="508" y="126" width="6" height="46" fill="#E9E4D6" class="cursor"/>

  <text x="60" y="205" class="mono fade3" font-size="17" fill="#E9E4D6" fill-opacity="0.85" letter-spacing="3">SOFTWARE  ·  FULL STACK  ·  AI</text>
  <text x="60" y="231" class="mono fade3" font-size="13" fill="#E9E4D6" fill-opacity="0.45">Ingeniería Informática @ ULL  —  Tenerife, Canarias</text>

  <!-- scan beam -->
  <g clip-path="inset(0 round 14px)">
    <rect class="scan" x="0" y="0" width="160" height="260" fill="url(#beam)"/>
  </g>
</svg>
