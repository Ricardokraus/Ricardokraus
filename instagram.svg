<svg xmlns="http://www.w3.org/2000/svg" width="118" height="37" viewBox="0 0 118 37" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .face { animation: press 4.5s infinite; animation-delay: 3.4s; }
    @keyframes press {
      0%, 84% { transform: translateY(0); animation-timing-function: ease-in; }
      87%, 91% { transform: translateY(3px); animation-timing-function: ease-out; }
      96%, 100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .face { animation: none; } }
  </style>
  <rect x="0" y="3" width="118" height="34" rx="9" fill="#1c2128"/>
  <g class="face">
    <rect x="0.5" y="0.5" width="117" height="33" rx="8.5" fill="#2d333b" stroke="#444c56"/>
    <g transform="translate(15 9)" stroke="#E6EDF3" stroke-width="1.5">
      <rect x="1" y="1" width="14" height="14" rx="4"/>
      <circle cx="8" cy="8" r="3.2"/>
      <circle cx="12" cy="4" r="0.9" fill="#E6EDF3" stroke="none"/>
    </g>
    <text x="39" y="17.5" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6EDF3">Instagram</text>
  </g>
</svg>
