<svg xmlns="http://www.w3.org/2000/svg" width="152" height="37" viewBox="0 0 152 37" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .face { animation: press 4.5s infinite; animation-delay: 1.1s; }
    @keyframes press {
      0%, 84% { transform: translateY(0); animation-timing-function: ease-in; }
      87%, 91% { transform: translateY(3px); animation-timing-function: ease-out; }
      96%, 100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .face { animation: none; } }
  </style>
  <rect x="0" y="3" width="152" height="34" rx="9" fill="#1c2128"/>
  <g class="face">
    <rect x="0.5" y="0.5" width="151" height="33" rx="8.5" fill="#2d333b" stroke="#444c56"/>
    <g transform="translate(15 9)" stroke="#E6EDF3" stroke-width="1.4" stroke-linecap="round">
      <circle cx="8" cy="8" r="7"/>
      <ellipse cx="8" cy="8" rx="3" ry="7"/>
      <path d="M1 8h14"/>
    </g>
    <text x="39" y="17.5" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6EDF3">Website</text>
    <rect x="102" y="9.5" width="38" height="15" rx="7.5" fill="#E6EDF3" fill-opacity="0.14" stroke="#E6EDF3" stroke-opacity="0.35"/>
    <text x="121" y="17.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" letter-spacing="0.8" fill="#E6EDF3">WIP</text>
  </g>
</svg>
